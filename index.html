<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diagnostic écrans 6MIC</title>
<!--
  Diagnostic des écrans Samsung du 6MIC.
  Écrit en JavaScript ES5 et en CSS sans Grid ni gap, pour tourner sur Chromium 47 et plus.
  Aucune dépendance externe : tout est dans ce fichier, sw.js et le dossier media/.
  Paramètre facultatif : ?ecran=1 (numéro ou nom de l'écran, affiché dans le résumé).
-->
<style>
@font-face { font-family: 'DiagWoff2'; src: url(media/test.woff2) format('woff2'); }
@font-face { font-family: 'DiagWoff'; src: url(media/test.woff) format('woff'); }

html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  background: #0b0d12; color: #f2f4f8;
  font-family: "SamsungOneUI", "SamsungOne", "Tizen Sans", Roboto, Arial, Helvetica, sans-serif;
  transform-origin: 0 0;
}

/* Bandeau supérieur */
#topbar { position: absolute; left: 0; top: 0; width: 1920px; height: 96px; background: #12151d; z-index: 50; }
#topbar .title { position: absolute; left: 56px; top: 26px; font-size: 34px; font-weight: bold; letter-spacing: 0.5px; }
#topbar .screen { position: absolute; left: 560px; top: 32px; font-size: 26px; color: #9aa4b5; }
#topbar .step { position: absolute; right: 56px; top: 30px; font-size: 28px; color: #c7cfdb; text-align: right; }
#progress { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: #22c55e; }

/* Zone de test */
#test { position: absolute; left: 0; top: 96px; width: 1920px; height: 984px; overflow: hidden; }
#caption {
  position: absolute; left: 56px; right: 56px; bottom: 40px; z-index: 40;
  padding: 22px 32px; background: rgba(0, 0, 0, 0.72); border-left: 8px solid #22c55e;
  font-size: 34px; line-height: 46px;
}
#caption .look { display: block; font-size: 28px; color: #fcd34d; margin-top: 6px; }
.panel { position: absolute; left: 56px; top: 56px; right: 56px; font-size: 32px; line-height: 48px; }
.panel h1 { font-size: 64px; line-height: 76px; margin: 0 0 24px 0; }
.panel p { margin: 0 0 18px 0; color: #c7cfdb; }

/* Vidéos */
.fullvideo { position: absolute; left: 0; top: 0; width: 1920px; height: 984px; background: #000; }
.overlay-band {
  position: absolute; left: 0; top: 64px; width: 1920px; height: 110px; z-index: 30;
  background: rgba(220, 38, 38, 0.88); overflow: hidden; white-space: nowrap;
}
.overlay-band .crawl { position: absolute; left: 0; top: 24px; font-size: 54px; font-weight: bold; color: #fff; animation: crawl 9s linear infinite; }

/* Animations */
@keyframes crawl { from { transform: translateX(1920px); } to { transform: translateX(-2600px); } }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08); } }
@keyframes slidein {
  0% { transform: translateX(-120px); opacity: 0; }
  25% { transform: translateX(0); opacity: 1; }
  75% { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(60px); opacity: 0; }
}
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blurry { from { filter: blur(0px); } to { filter: blur(14px); } }
@keyframes shadow {
  from { box-shadow: 0 0 0 rgba(0, 0, 0, 0.6); transform: translateY(0); }
  to { box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9); transform: translateY(-30px); }
}
@keyframes lefttop {
  0% { left: 40px; top: 60px; }
  50% { left: 1440px; top: 520px; }
  100% { left: 40px; top: 60px; }
}
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 984px; }
.layer img { display: block; width: 1920px; height: 1080px; }
.kb { animation: kenburns 6s ease-in-out infinite alternate; }
.shade { background: linear-gradient(to right, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.05)); }
.annonce { position: absolute; left: 120px; top: 110px; width: 1300px; }
.annonce .artist { font-size: 150px; line-height: 160px; font-weight: bold; text-transform: uppercase; animation: slidein 3s ease-out infinite; }
.annonce .date { font-size: 64px; margin-top: 30px; animation: slidein 3s ease-out 0.25s infinite; }
.annonce .price { display: inline-block; margin-top: 40px; padding: 18px 34px; background: #facc15; color: #111; font-size: 48px; font-weight: bold; border-radius: 12px; animation: pulse 1.5s ease-in-out infinite; }
.ticker { position: absolute; left: 0; bottom: 210px; width: 1920px; height: 90px; background: #111827; overflow: hidden; white-space: nowrap; }
.ticker .crawl { position: absolute; left: 0; top: 16px; font-size: 52px; color: #fde68a; animation: crawl 12s linear infinite; }
.xfade { animation: fade 1.5s ease-in-out infinite alternate; }
.blurlayer { animation: blurry 2s ease-in-out infinite alternate; }
.card { position: absolute; width: 420px; height: 280px; border-radius: 24px; background: #f8fafc; color: #111; font-size: 40px; font-weight: bold; text-align: center; line-height: 280px; animation: shadow 1.2s ease-in-out infinite alternate; }
.box { position: absolute; width: 420px; height: 300px; border-radius: 16px; animation: lefttop 4s ease-in-out infinite; }

/* Résumé */
#summary { position: absolute; left: 0; top: 96px; width: 1920px; height: 984px; display: none; background: #0b0d12; }
#summary .head { position: absolute; left: 48px; top: 20px; right: 520px; font-size: 26px; color: #c7cfdb; line-height: 36px; }
#summary .head b { color: #fff; font-size: 34px; }
#summary .cols { position: absolute; left: 48px; top: 110px; width: 1380px; height: 800px; display: flex; flex-direction: row; }
#summary .col { width: 445px; margin-right: 16px; }
#summary .group { font-size: 22px; font-weight: bold; color: #93c5fd; text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 6px 0; }
#summary .row { display: flex; flex-direction: row; align-items: flex-start; font-size: 17px; line-height: 22px; margin-bottom: 4px; }
#summary .dot { flex: none; width: 52px; height: 20px; margin-right: 6px; margin-top: 1px; border-radius: 4px; font-size: 12px; line-height: 20px; font-weight: bold; text-align: center; color: #0b0d12; }
#summary .lbl { flex: none; width: 134px; margin-right: 6px; color: #aab3c2; }
#summary .val { flex: 1; color: #fff; word-wrap: break-word; overflow: hidden; }
.st-ok { background: #22c55e; } .st-warn { background: #f59e0b; } .st-fail { background: #ef4444; color: #fff !important; } .st-info { background: #64748b; color: #fff !important; }
#summary .side { position: absolute; right: 48px; top: 20px; width: 440px; text-align: center; }
#summary .side .clock { font-size: 64px; font-weight: bold; line-height: 72px; }
#summary .side .small { font-size: 20px; line-height: 28px; color: #c7cfdb; }
#qr { display: block; margin: 16px auto 10px auto; background: #fff; }
#summary .foot { position: absolute; left: 48px; right: 48px; bottom: 14px; font-size: 16px; line-height: 22px; color: #7c8798; }

/* Tests de polices */
.fontprobe { position: absolute; left: -9999px; top: 0; font-size: 80px; white-space: nowrap; visibility: hidden; }
#errorbox { position: absolute; left: 56px; top: 110px; right: 56px; z-index: 60; font-size: 22px; color: #fecaca; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <div class="title">Diagnostic écrans · 6MIC</div>
    <div class="screen" id="screenName"></div>
    <div class="step" id="stepLabel">Préparation…</div>
    <div id="progress"></div>
  </div>
  <div id="test"></div>
  <div id="summary"></div>
  <div id="errorbox"></div>
</div>
<div id="boot" style="position:fixed;right:6px;bottom:6px;z-index:99999;background:#facc15;color:#111;font:bold 18px Arial,Helvetica,sans-serif;line-height:24px;padding:6px 12px;border-radius:6px;max-width:900px;">1/3 · HTML chargé. Si ce message reste seul, le script n'a pas démarré.</div>

<script>
/* ======================================================================
   Outils généraux (ES5 uniquement)
   ====================================================================== */
var STAGE_W = 1920, STAGE_H = 1080;
var VERSION = 'v5';
var results = [];
var errors = [];
var startedAt = new Date();
var stage = document.getElementById('stage');
var testArea = document.getElementById('test');
var params = parseParams();

window.onerror = function (msg, src, line) {
  errors.push(String(msg) + ' (ligne ' + line + ')');
  try { if (typeof boot === 'function') { boot(bootStage); } } catch (e0) {}
  try {
    var box = document.getElementById('errorbox');
    box.style.display = 'block';
    box.appendChild(document.createTextNode('Erreur JavaScript : ' + msg + ' (ligne ' + line + ')'));
    box.appendChild(document.createElement('br'));
  } catch (e) {}
  return false;
};

function parseParams() {
  var out = {}, q = location.search.replace(/^\?/, '').split('&'), i, kv;
  for (i = 0; i < q.length; i++) {
    if (!q[i]) { continue; }
    kv = q[i].split('=');
    try { out[decodeURIComponent(kv[0])] = kv.length > 1 ? decodeURIComponent(kv[1].replace(/\+/g, ' ')) : ''; } catch (e) {}
  }
  return out;
}

function now() { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); }
function pad(n, w) { var s = String(n); while (s.length < (w || 2)) { s = '0' + s; } return s; }
function fmtTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function fmtDate(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
function round(x, n) { var p = Math.pow(10, n || 0); return Math.round(x * p) / p; }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (text !== undefined && text !== null) { e.appendChild(document.createTextNode(text)); }
  return e;
}
function clearNode(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }
function remove(n) { if (n && n.parentNode) { n.parentNode.removeChild(n); } }
function bust(url) { return url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + new Date().getTime() + '_' + Math.floor(Math.random() * 1e6); }

/* Ajoute un résultat. status : ok | warn | fail | info */
function add(group, key, label, value, status) {
  results.push({ group: group, key: key, label: label, value: String(value), status: status || 'info' });
}

/* Témoin de démarrage, placé hors de la scène : il reste lisible même si la scène ne s'affiche pas. */
var bootEl = document.getElementById('boot'), bootStage = '';
function boot(text) {
  bootStage = text;
  try { bootEl.innerHTML = ''; bootEl.appendChild(document.createTextNode(text + (errors.length ? ' · ERREUR : ' + errors[errors.length - 1] : ''))); } catch (e) {}
}

/* Met la scène 1920x1080 à l'échelle de la fenêtre.
   Par défaut avec la propriété CSS zoom : le navigateur Samsung (Tizen 4) n'a pas affiché
   la scène réduite par transform. ?mode=transform reprend l'ancienne méthode, ?mode=none n'en applique aucune. */
var lastScale = 1;
var SCALE_MODE = params.mode || (params.noscale !== undefined ? 'none' : 'zoom');
function fitStage() {
  var w = window.innerWidth || document.documentElement.clientWidth || STAGE_W;
  var h = window.innerHeight || document.documentElement.clientHeight || STAGE_H;
  var s = Math.min(w / STAGE_W, h / STAGE_H);
  if (!(s > 0.2 && s < 5)) { s = 1; }
  var x = Math.max(0, Math.round((w - STAGE_W * s) / 2)), y = Math.max(0, Math.round((h - STAGE_H * s) / 2));
  stage.style.transform = 'none'; stage.style.webkitTransform = 'none'; stage.style.zoom = '';
  stage.style.left = '0px'; stage.style.top = '0px';
  if (SCALE_MODE === 'none') { lastScale = 1; return 1; }
  if (SCALE_MODE === 'transform') {
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    stage.style.webkitTransform = stage.style.transform;
  } else {
    /* Avec zoom, les positions de l'élément sont elles aussi multipliées : on les divise d'autant. */
    stage.style.zoom = String(s);
    stage.style.left = Math.round(x / s) + 'px';
    stage.style.top = Math.round(y / s) + 'px';
  }
  lastScale = s;
  return s;
}
window.addEventListener('resize', fitStage);

function setStep(i, n, title) {
  document.getElementById('stepLabel').innerHTML = '';
  document.getElementById('stepLabel').appendChild(document.createTextNode('Étape ' + i + ' / ' + n + ' · ' + title));
  document.getElementById('progress').style.width = Math.round(100 * (i - 1) / n) + '%';
}

/* Légende en bas d'écran : ce qui se passe, et ce qu'il faut regarder. */
function caption(text, look) {
  var c = el('div', null, text);
  c.id = 'caption';
  if (look) { c.appendChild(el('span', 'look', 'À regarder : ' + look)); }
  testArea.appendChild(c);
}

/* Appelle cb une seule fois, au premier des deux : fin normale ou délai dépassé. */
function once(cb) { var called = false; return function () { if (called) { return; } called = true; cb.apply(null, arguments); }; }

/* ======================================================================
   Étapes
   ====================================================================== */

function stepIntro(done) {
  var p = el('div', 'panel');
  p.appendChild(el('h1', null, 'Diagnostic en cours'));
  p.appendChild(el('p', null, 'Durée : environ 3 minutes. Laissez l\'écran allumé et ne touchez pas la télécommande.'));
  p.appendChild(el('p', null, 'Des animations et des vidéos vont défiler, puis un résumé s\'affichera.'));
  p.appendChild(el('p', null, 'À la fin : prenez une photo du résumé, ou scannez le QR code avec votre téléphone.'));
  p.appendChild(el('p', null, 'Un court bip sonore retentira vers la fin (test du son).'));
  testArea.appendChild(p);
  setTimeout(done, 5000);
}

/* --- Identification de l'écran et du moteur --- */
function stepIdent(done) {
  var G = 'Écran et moteur', ua = navigator.userAgent || '';
  var m = ua.match(/Chrome\/(\d+)/), chrome = m ? parseInt(m[1], 10) : 0;
  var tz = ua.match(/Tizen\s?([\d.]+)/i), tizen = tz ? tz[1] : '';
  add(G, 'engine', 'Moteur', chrome ? 'Chromium ' + chrome : 'inconnu', chrome >= 56 ? 'ok' : (chrome >= 47 ? 'warn' : 'fail'));
  add(G, 'tizen', 'Tizen', tizen || 'non indiqué', tizen ? 'info' : 'warn');
  var ctx = location.protocol === 'file:' ? 'application installée' : 'page web (' + location.protocol.replace(':', '') + ')';
  add(G, 'context', 'Contexte', ctx, 'info');

  var iw = window.innerWidth, ih = window.innerHeight, dpr = window.devicePixelRatio || 1;
  add(G, 'viewport', 'Taille page', iw + ' × ' + ih + ' px', iw >= 1900 ? 'ok' : (iw >= 1280 ? 'warn' : 'fail'));
  add(G, 'screen', 'Écran annoncé', screen.width + ' × ' + screen.height, 'info');
  add(G, 'dpr', 'Densité', 'x' + round(dpr, 2) + (dpr >= 2 ? ' (rendu 4K)' : ' (rendu ' + Math.round(iw * dpr) + ' px de large)'), 'info');
  add(G, 'scale', 'Échelle scène', 'x' + round(fitStage(), 3) + ' (' + SCALE_MODE + ')', 'info');
  add(G, 'cpu', 'Cœurs', navigator.hardwareConcurrency || 'inconnu', 'info');
  if (window.performance && performance.memory && performance.memory.jsHeapSizeLimit) {
    add(G, 'heap', 'Mémoire JS max', Math.round(performance.memory.jsHeapSizeLimit / 1048576) + ' Mo', 'info');
  }
  var off = -new Date().getTimezoneOffset(), tzName = '';
  try { tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  add(G, 'tz', 'Fuseau', 'UTC' + (off >= 0 ? '+' : '-') + pad(Math.floor(Math.abs(off) / 60)) + ':' + pad(Math.abs(off) % 60) + (tzName ? ' ' + tzName : ''), off === 120 || off === 60 ? 'ok' : 'warn');

  /* API Samsung : présentes seulement dans une application installée (.wgt). */
  var sam = [];
  if (window.tizen) { sam.push('tizen'); }
  if (window.webapis) {
    sam.push('webapis');
    try { add(G, 'model', 'Modèle', webapis.productinfo.getRealModel() || webapis.productinfo.getModel(), 'info'); } catch (e1) {}
    try { add(G, 'firmware', 'Firmware', webapis.productinfo.getFirmware(), 'info'); } catch (e2) {}
  }
  if (window.b2bapis) { sam.push('b2bapis'); }
  add(G, 'samsungapi', 'API Samsung', sam.length ? sam.join(', ') : 'aucune (normal pour une page web)', 'info');
  add(G, 'ua', 'User agent', ua, 'info');
  setTimeout(done, 300);
}

/* --- JavaScript : syntaxe et API disponibles --- */
function stepJs(done) {
  var G = 'JavaScript et CSS';
  var syntax = [
    ['ES2015 flèches', 'return (function(){ var f = (a) => a + 1; return f(1); })()'],
    ['let / const', 'let a = 1; const b = 2; return a + b;'],
    ['classes', 'class A { m() { return 3; } } return new A().m();'],
    ['gabarits `…`', 'var x = 3; return `${x}`;'],
    ['déstructuration', 'var { a } = { a: 3 }; return a;'],
    ['async / await', 'async function f() { return 3; } return typeof f;'],
    ['ES2018 { ...obj }', 'var o = { ...{ a: 3 } }; return o.a;'],
    ['ES2020 a?.b', 'var o = null; return o?.b === undefined ? 3 : 0;']
  ];
  var okList = [], koList = [], i;
  for (i = 0; i < syntax.length; i++) {
    try { new Function(syntax[i][1])(); okList.push(syntax[i][0]); } catch (e) { koList.push(syntax[i][0]); }
  }
  var target = 'ES5';
  if (okList.indexOf('ES2015 flèches') >= 0 && okList.indexOf('classes') >= 0 && okList.indexOf('let / const') >= 0) { target = 'ES2015'; }
  if (target === 'ES2015' && okList.indexOf('async / await') >= 0) { target = 'ES2017'; }
  if (target === 'ES2017' && okList.indexOf('ES2018 { ...obj }') >= 0) { target = 'ES2018'; }
  if (target === 'ES2018' && okList.indexOf('ES2020 a?.b') >= 0) { target = 'ES2020+'; }
  add(G, 'jstarget', 'Syntaxe JS', 'jusqu\'à ' + target, target === 'ES5' ? 'warn' : 'ok');
  add(G, 'jsmissing', 'Syntaxe absente', koList.length ? koList.join(', ') : 'aucune', koList.length ? 'info' : 'ok');

  var apis = [
    ['Promise', !!window.Promise], ['fetch', !!window.fetch], ['Object.assign', !!Object.assign],
    ['Map/Set', !!(window.Map && window.Set)], ['URLSearchParams', !!window.URLSearchParams],
    ['IntersectionObserver', !!window.IntersectionObserver], ['ResizeObserver', !!window.ResizeObserver],
    ['Web Animations', !!(document.body && document.body.animate)], ['document.fonts', !!document.fonts],
    ['WebSocket', !!window.WebSocket], ['EventSource', !!window.EventSource],
    ['MediaSource', !!window.MediaSource]
  ];
  var have = [], miss = [];
  for (i = 0; i < apis.length; i++) { (apis[i][1] ? have : miss).push(apis[i][0]); }
  add(G, 'apimissing', 'API absentes', miss.length ? miss.join(', ') : 'aucune', 'info');
  var gl = false;
  try { var cv = document.createElement('canvas'); gl = !!(cv.getContext('webgl') || cv.getContext('experimental-webgl')); } catch (e3) {}
  add(G, 'webgl', 'WebGL', gl ? 'oui' : 'non', gl ? 'info' : 'info');
  setTimeout(done, 200);
}

/* --- CSS : fonctions de mise en page et d'effets --- */
function cssSupports(prop, val) {
  try { if (window.CSS && CSS.supports) { return CSS.supports(prop, val); } } catch (e) {}
  var d = document.createElement('div');
  try { d.style.setProperty(prop, val); } catch (e2) { return false; }
  return d.style.getPropertyValue(prop) !== '';
}
function stepCss(done) {
  var G = 'JavaScript et CSS';
  var checks = [
    ['Flexbox', 'display', 'flex', true], ['CSS Grid', 'display', 'grid', false],
    ['Variables CSS', '--a', '1', false], ['filter: blur', 'filter', 'blur(2px)', false],
    ['backdrop-filter', 'backdrop-filter', 'blur(2px)', false], ['position: sticky', 'position', 'sticky', false],
    ['clip-path', 'clip-path', 'circle(50%)', false], ['mix-blend-mode', 'mix-blend-mode', 'multiply', false],
    ['object-fit', 'object-fit', 'cover', false], ['aspect-ratio', 'aspect-ratio', '16 / 9', false]
  ];
  var yes = [], no = [], i;
  for (i = 0; i < checks.length; i++) {
    if (cssSupports(checks[i][1], checks[i][2])) { yes.push(checks[i][0]); } else { no.push(checks[i][0]); }
  }
  /* L'espacement « gap » en Flexbox ne se détecte pas avec CSS.supports : on le mesure. */
  var flexGap = false;
  try {
    var f = document.createElement('div');
    f.style.display = 'flex'; f.style.flexDirection = 'column'; f.style.position = 'absolute'; f.style.left = '-9999px';
    f.style.rowGap = '10px'; f.style.gap = '10px';
    f.appendChild(document.createElement('div')); f.appendChild(document.createElement('div'));
    document.body.appendChild(f); flexGap = f.scrollHeight === 10; remove(f);
  } catch (e) {}
  if (flexGap) { yes.push('gap en Flexbox'); } else { no.push('gap en Flexbox'); }
  add(G, 'cssno', 'CSS absent', no.join(', ') || 'rien', no.length ? 'info' : 'ok');
  add(G, 'grid', 'CSS Grid', yes.indexOf('CSS Grid') >= 0 ? 'oui' : 'non : Flexbox seulement', yes.indexOf('CSS Grid') >= 0 ? 'ok' : 'warn');
  setTimeout(done, 200);
}

/* --- Images et polices --- */
var bgExt = 'jpg';
function imgTest(src, timeout, cb) {
  var img = new Image(), t0 = now(), fin = once(cb);
  img.onload = function () { fin(true, now() - t0, img); };
  img.onerror = function () { fin(false, now() - t0, img); };
  setTimeout(function () { fin(false, -1, img); }, timeout);
  img.src = src;
}
function stepImages(done) {
  var G = 'Images et polices';
  var webp = 'data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA';
  var avif = 'data:image/avif;base64,AAAAIGZ0eXBhdmlmAAAAAGF2aWZtaWYxbWlhZk1BMUIAAADybWV0YQAAAAAAAAAoaGRscgAAAAAAAAAAcGljdAAAAAAAAAAAAAAAAGxpYmF2aWYAAAAADnBpdG0AAAAAAAEAAAAeaWxvYwAAAABEAAABAAEAAAABAAABGgAAAB0AAAAoaWluZgAAAAAAAQAAABppbmZlAgAAAAABAABhdjAxQ29sb3IAAAAAamlwcnAAAABLaXBjbwAAABRpc3BlAAAAAAAAAAIAAAACAAAAEHBpeGkAAAAAAwgICAAAAAxhdjFDgQ0MAAAAABNjb2xybmNseAACAAIAAYAAAAAXaXBtYQAAAAAAAAABAAEEAQKDBAAAACVtZGF0EgAKCBgANogQEAwgMg8f8D///8WfhwB8+ErK42A=';
