<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back-office · Écrans TV 6MIC</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://use.typekit.net/trm8rah.css">
<link rel="stylesheet" href="/lecteur/gabarits.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="ah">
  <div class="ah-in">
    <div class="ah-top">
      <a class="ah-brand" href="/admin/"><img src="/logo/6mic-logo-blanc-tv.png" alt="6MIC" width="76" height="30"><span class="ah-t">Écrans TV<span class="ah-suite"> · Back-office</span></span></a>
      <span class="ah-sp"></span>
      <span class="ah-user" id="moi" hidden></span>
      <button type="button" class="ah-a" id="deconnexion" hidden>Se déconnecter</button>
    </div>
    <nav class="ah-nav" id="nav" hidden>
      <!-- Sur téléphone, ces onglets deviennent une barre fixe en bas de l'écran (icône + nom court). -->
      <div class="ah-tabs" role="group" aria-label="Rubriques">
        <button type="button" data-vue="tableau"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg><span>Écrans</span></button>
        <button type="button" data-vue="contenus"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg><span>Contenus</span></button>
        <button type="button" data-vue="calendrier"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendrier</span></button>
        <button type="button" data-vue="flux"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span class="long">Flux et boucles</span><span class="court">Boucles</span></button>
        <button type="button" data-vue="journal"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Journal</span></button>
      </div>
      <p class="etat-sync" id="sync" role="status"></p>
    </nav>
  </div>
</header>
<main class="vue" id="vue">
  <p class="chargement" id="demarrage">Chargement…</p>
  <form class="connexion" id="connexion" hidden novalidate>
    <p class="surtitre">Back-office</p>
    <h1>Écrans TV</h1>
    <p class="aide">Réservé à l’équipe du 6MIC.</p>
    <div class="champ"><label for="cx-prenom">Votre prénom</label><input type="text" id="cx-prenom" autocomplete="nickname" maxlength="40" required><small>Sert à savoir qui a modifié quoi (journal).</small></div>
    <div class="champ"><label for="cx-mdp">Mot de passe</label><input type="password" id="cx-mdp" autocomplete="current-password" required></div>
    <p class="erreur" id="cx-erreur" role="alert" hidden></p>
    <div><button type="submit" class="btn btn-noir">Se connecter →</button></div>
  </form>
  <div id="app" hidden></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/vendor/qrcode.js"></script>
<script src="/lecteur/regles.js"></script>
<script src="/lecteur/gabarits.js"></script>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
